<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具入口網頁 | Tools Portal</title>
  <!-- Tailwind CSS CDN (快速外觀排版) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 漸層背景與卡片懸浮效果 */
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
    }
    .tool-card {
      transition: all 0.25s ease-in-out;
    }
    .tool-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.15);
    }
  </style>
</head>
<body class="font-sans text-slate-800 flex flex-col min-h-screen">

  <!-- 頂部 Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl font-bold shadow-md">
          <i class="fa-solid font-sharp fa-cubes"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-slate-900 leading-tight">教學與實用工具平台</h1>
          <p class="text-xs text-slate-500">線上微型工具庫入口</p>
        </div>
      </div>
    </div>
  </header>

  <!-- 主內容區塊 -->
  <main class="flex-grow max-w-6xl mx-auto px-6 py-10 w-full">
    <!-- 標頭簡介 -->
    <div class="mb-10 text-center max-w-2xl mx-auto">
      <h2 class="text-3xl font-extrabold text-slate-900 mb-3">選擇您需要的工具</h2>
      <p class="text-slate-600 leading-relaxed">
        點選下方工具卡片即可開啟對應專案。部分工具需配合個人 Google 試算表使用。
      </p>
    </div>

    <!-- 載入中狀態 -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 text-slate-400">
      <i class="fa-solid fa-circle-notch fa-spin text-4xl mb-3 text-indigo-500"></i>
      <p class="text-sm font-medium">正在載入工具清單...</p>
    </div>

    <!-- 錯誤狀態 -->
    <div id="error-message" class="hidden max-w-md mx-auto bg-red-50 border border-red-200 rounded-2xl p-6 text-center text-red-600">
      <i class="fa-solid fa-triangle-exclamation text-3xl mb-2"></i>
      <p id="error-text" class="text-sm">無法取得工具列表，請稍後再試。</p>
    </div>

    <!-- 工具卡片容器 (動態渲染) -->
    <div id="tool-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- 頁尾 Footer -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-400">
    <p>© Tools Portal. Powered by GitHub Pages & Google Apps Script.</p>
  </footer>

  <script>
    // ⚠️ 請替換為你在階段二得到的 GAS Web App URL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbzq_tuayTvoxvzJw59NCWo5KFDDN2v2oPtIR6jHKf3E8HqizvupYAHOVMaID3192WcWmg/exec";

    document.addEventListener("DOMContentLoaded", () => {
      loadTools();
    });

    async function loadTools() {
      const loadingEl = document.getElementById("loading");
      const gridEl = document.getElementById("tool-grid");
      const errorEl = document.getElementById("error-message");

      try {
        const response = await fetch(`${GAS_API_URL}?action=getToolList`);
        const result = await response.json();

        if (!result.success) throw new Error(result.message || "讀取資料失敗");

        loadingEl.classList.add("hidden");
        
        if (result.data.length === 0) {
          gridEl.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10">目前沒有可用的工具。</p>`;
          return;
        }

        // 渲染每個工具卡片
        gridEl.innerHTML = result.data.map(tool => createToolCard(tool)).join('');

      } catch (err) {
        console.error("載入失敗：", err);
        loadingEl.classList.add("hidden");
        document.getElementById("error-text").textContent = "讀取資料失敗，請確認 API 網址設定正確。";
        errorEl.classList.remove("hidden");
      }
    }

    function createToolCard(tool) {
      // 處理 Icon 邏輯 (支援 FontAwesome class 或圖片 URL)
      let iconHtml = `<i class="fa-solid fa-screwdriver-wrench text-2xl text-indigo-600"></i>`;
      if (tool.icon) {
        if (tool.icon.startsWith("http")) {
          iconHtml = `<img src="${tool.icon}" alt="${tool.toolName}" class="w-8 h-8 object-cover rounded-md">`;
        } else if (tool.icon.startsWith("fa-")) {
          iconHtml = `<i class="fa-solid ${tool.icon} text-2xl text-indigo-600"></i>`;
        }
      }

      return `
        <a href="${tool.githubLink}" target="_blank" rel="noopener noreferrer" 
           class="tool-card group bg-white rounded-2xl p-6 border border-slate-200/80 flex flex-col justify-between shadow-sm hover:border-indigo-200">
          <div>
            <!-- 上方圖示與 ID -->
            <div class="flex items-center justify-between mb-4">
              <div class="w-12 h-12 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-colors duration-200">
                ${iconHtml}
              </div>
              <span class="text-xs font-mono font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full">
                ${tool.toolId}
              </span>
            </div>

            <!-- 工具名稱與介紹 -->
            <h3 class="text-lg font-bold text-slate-900 group-hover:text-indigo-600 transition-colors mb-2">
              ${tool.toolName}
            </h3>
            <p class="text-sm text-slate-500 leading-relaxed line-clamp-3 mb-6">
              ${tool.description || '暫無簡短介紹。'}
            </p>
          </div>

          <!-- 下方按鈕樣式 -->
          <div class="flex items-center text-xs font-bold text-indigo-600 group-hover:translate-x-1 transition-transform">
            <span>開啟工具</span>
            <i class="fa-solid fa-arrow-right ml-2"></i>
          </div>
        </a>
      `;
    }
  </script>
</body>
</html>
